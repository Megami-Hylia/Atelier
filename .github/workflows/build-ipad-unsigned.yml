name: Build iPad unsigned
run-name: Atelier unsigned ${{ inputs.request_id || github.sha }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation token generated by the Windows script
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'Atelier/**'
      - 'AtelierTests/**'
      - 'Atelier.xcodeproj/**'
      - 'scripts/**'
      - '.github/workflows/build-ipad-unsigned.yml'

permissions:
  contents: read

concurrency:
  group: atelier-unsigned-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test IPA validation rules
        run: python3 scripts/test_verify_ipa.py
      - name: Build Release for physical iPad and package unsigned IPA
        run: bash scripts/build_unsigned_ipa.sh
      - name: Upload structurally verified device IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Atelier-unsigned
          path: |
            build/delivery/Atelier-unsigned.ipa
            build/delivery/BUILD_REPORT.json
            build/delivery/ipa-verification.json
            build/delivery/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - name: Run iPad simulator unit tests
        run: bash scripts/run_simulator_tests.sh
      - name: Upload diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Atelier-build-diagnostics
          path: |
            build/delivery/*.txt
            build/delivery/*.json
            build/delivery/build.log
            build/tests/
          if-no-files-found: warn
          retention-days: 7
